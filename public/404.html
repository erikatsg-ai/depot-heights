  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 35%, #115e59 65%, #134e4a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(45, 212, 191, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(20, 184, 166, 0.1) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(5deg); }
      66% { transform: translate(-20px, 20px) rotate(-3deg); }
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      z-index: 0;
      animation: floatShape 15s ease-in-out infinite;
    }

    .shape-1 { width: 300px; height: 300px; background: #5eead4; top: -100px; right: -100px; }
    .shape-2 { width: 200px; height: 200px; background: #2dd4bf; bottom: -50px; left: -50px; animation-delay: -5s; }
    .shape-3 { width: 150px; height: 150px; background: #14b8a6; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -10s; }

    @keyframes floatShape {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -30px) scale(1.1); }
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s ease-out;
      border: 1px solid rgba(94, 234, 212, 0.2);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-number {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 40%, #14b8a6 70%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
      position: relative;
      display: inline-block;
    }

    .error-number::after {
      content: '404';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 40%, #14b8a6 70%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
      opacity: 0.3;
      transform: scale(1.1);
      filter: blur(10px);
      z-index: -1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1.1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .error-icon {
      font-size: 64px;
      margin-bottom: 10px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .error-title {
      font-size: 28px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .error-description {
      font-size: 16px;
      line-height: 1.7;
      color: #000000;
      margin-bottom: 8px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #0d9488, #2dd4bf);
      margin: 20px auto;
      border-radius: 2px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: white;
      padding: 14px 32px;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
      margin-top: 10px;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(13, 148, 136, 0.5);
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    }

    .btn-home svg { width: 20px; height: 20px; fill: currentColor; }

    .suggestions {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #ccfbf1;
    }

    .suggestions p {
      font-size: 14px;
      color: #000000;
      margin-bottom: 12px;
    }

    .quick-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .quick-links a {
      color: #000000;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(13, 148, 136, 0.06);
    }

    .quick-links a:hover {
      color: #0d9488;
      background: rgba(13, 148, 136, 0.12);
    }

    @media (max-width: 640px) {
      .container { padding: 35px 25px; }
      .error-number { font-size: 80px; }

      .error-description { font-size: 15px; }
      .btn-home { padding: 12px 24px; font-size: 15px; width: 100%; justify-content: center; }
      .quick-links { gap: 8px; }
      .quick-links a { font-size: 13px; padding: 5px 10px; }
    }

    @media (max-width: 400px) {

      .error-number { font-size: 60px; }
      .error-icon { font-size: 48px; }
    }
  </style>
